[package]
name = "neoweb"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
arboard = "3.6.1"
base64 = "0.22"
directories = "6.0.0"
dpi = "0.1"
euclid = "0.22"
iced = { version = "0.14.0", features = ["tokio", "advanced", "canvas", "image", "wgpu"] }
iced_aw = { version = "0.14.1", default-features = false, features = ["spinner"] }
image = "0.25"
mlua = { version = "0.12.2", features = ["luajit", "vendored", "async"] }
percent-encoding = "2.3"
reqwest = { version = "0.13.5", features = ["json"] }
resvg = "0.45"
rusqlite = { version = "0.38.0", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
servo = "0.7.0"
raw-window-handle = "0.6"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "ansi"] }
url = "2.5.8"

# Fast development iteration profile balancing compile times with usable SpiderMonkey/Servo speeds
[profile.dev]
opt-level = 1

# Hybrid performance profile tailored for active browser testing with responsive layout & JS
[profile.medium]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
incremental = true

# Maximum performance profile for production deployments and benchmarks
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
